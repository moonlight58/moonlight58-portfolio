<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <meta name="title" content="Gaël Röthlin - Full-Stack Developer">
  <meta name="description"
    content="Computer Science student & full-stack developer. Explore my portfolio featuring projects in web development, CLI applications, and digital innovation.">
  <meta name="keywords" content="developer, portfolio, web development, Vue.js, C, Python, software engineering">
  <meta name="author" content="Gaël Röthlin">
  <meta name="charset" content="UTF-8">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://portfolio.grothlin.fr/">
  <meta property="og:title" content="Gaël Röthlin - Full-Stack Developer">
  <meta property="og:description"
    content="Computer Science student & full-stack developer. Explore my portfolio featuring projects in web development, CLI applications, and digital innovation.">
  <meta property="og:image" content="https://portfolio.grothlin.fr/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Gaël Röthlin — Full-Stack Developer">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://portfolio.grothlin.fr/">
  <meta name="twitter:title" content="Gaël Röthlin - Full-Stack Developer">
  <meta name="twitter:description"
    content="Computer Science student & full-stack developer. Explore my portfolio featuring projects in web development, CLI applications, and digital innovation.">
  <meta name="twitter:image" content="https://portfolio.grothlin.fr/og-image.png">
  <meta name="twitter:image:alt" content="Gaël Röthlin — Full-Stack Developer">

  <!-- Canonical -->
  <link rel="canonical" href="https://portfolio.grothlin.fr/">

  <!-- Resolve the theme before first paint to avoid a flash of the wrong colors -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* ignore */ }
    })();
  </script>

  <!-- Additional Meta Tags -->
  <meta name="theme-color" content="#fafaf8">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English, French">

  <link rel="icon" href="/moon.svg" type="image/svg+xml">

  <!-- Fonts: preconnect + non-blocking stylesheet (faster LCP than CSS @import) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap">

  <title>Gaël Röthlin - Portfolio</title>
</head>

<body>
  <noscript>
    <strong>We're sorry but this portfolio doesn't work properly without JavaScript enabled. Please enable it to
      continue.</strong>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <!-- built files will be auto injected -->

  <!-- Hidden form for Netlify to detect -->
  <form name="contact" netlify hidden data-netlify-recaptcha="true">
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="message" />
    <div data-netlify-recaptcha="true"></div>
  </form>

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Person",
      "name": "Gaël Röthlin",
      "url": "https://portfolio.grothlin.fr/",
      "image": "https://portfolio.grothlin.fr/moon.svg",
      "description": "Computer Science student and full-stack software developer focusing on web development and digital innovation",
      "sameAs": [
        "https://github.com/moonlight58",
        "https://www.instagram.com/osiris._25"
      ],
      "jobTitle": "Software Developer & Engineering Student",
      "worksFor": {
        "@type": "Organization",
        "name": "Université de Franche-Comté"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Besançon",
        "addressCountry": "FR"
      }
    }
    </script>
</body>

</html>
